name: Test Melisma on 32-bit Android TV

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_tv_ui.py'
      - 'scripts/patch_tv_transport.py'
      - 'scripts/patch_tv_seek_escape.py'
      - 'scripts/patch_tv_settings.py'
      - 'scripts/patch_tv_settings_all.py'
      - 'scripts/patch_tv_sync_v25.py'
      - 'scripts/patch_tv_hidden_down.py'
      - 'scripts/patch_tv_v26.py'
      - 'scripts/patch_tv_v261.py'
      - 'scripts/patch_tv_v262.py'
      - 'scripts/patch_tv_v263.py'
      - 'scripts/patch_tv_v264.py'
      - 'scripts/patch_tv_v27.py'
      - 'scripts/patch_abis.py'
      - '.github/workflows/test-32bit.yml'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional upstream release tag (leave blank for latest, e.g. v2.11.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out this build automation
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Resolve Melisma release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-$(gh api repos/MelismaApp/melisma/releases/latest --jq '.tag_name')}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Testing upstream $TAG"

      - name: Check out upstream release
        uses: actions/checkout@v4
        with:
          repository: MelismaApp/melisma
          ref: ${{ steps.version.outputs.tag }}
          path: melisma
          persist-credentials: false

      - name: Enable 32-bit ARM in debug build
        run: python3 automation/scripts/patch_abis.py melisma/app/build.gradle.kts --mode test

      - name: Apply TV v2 patches (backgrounds, remote focus, auto-hide)
        run: python3 automation/scripts/patch_tv_ui.py melisma

      - name: Fix Cinema and Lyrics transport D-pad focus
        run: python3 automation/scripts/patch_tv_transport.py melisma

      - name: Fix seek-slider focus trap (Up/Down/Back)
        run: python3 automation/scripts/patch_tv_seek_escape.py melisma

      - name: Fix D-pad focus on Style and settings choice chips
        run: python3 automation/scripts/patch_tv_settings.py melisma

      - name: Validate all Settings sections for D-pad focus
        run: python3 automation/scripts/patch_tv_settings_all.py melisma

      - name: Add TV v2.5 per-song live timing panel and stable settings
        run: python3 automation/scripts/patch_tv_sync_v25.py melisma

      - name: Allow Down to reach player when the top menu is hidden
        run: python3 automation/scripts/patch_tv_hidden_down.py melisma

      - name: Apply TV v2.6 timing access, seeking status, and calm background transitions
        run: python3 automation/scripts/patch_tv_v26.py melisma

      - name: Fix Shield artwork crossfades and transient Amazon Music cover gaps
        run: python3 automation/scripts/patch_tv_v261.py melisma

      - name: Move romanization and translation into persistent Language Settings
        run: python3 automation/scripts/patch_tv_v262.py melisma

      - name: Fix Cover Blur right-arrow D-pad increments
        run: python3 automation/scripts/patch_tv_v263.py melisma

      - name: Restore Language section first-control D-pad focus
        run: python3 automation/scripts/patch_tv_v264.py melisma

      - name: Add saved 1-10 second transition setting to every background renderer
        run: python3 automation/scripts/patch_tv_v27.py melisma

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build 32-bit test APK
        working-directory: melisma
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK contains 32-bit ARM native code
        shell: bash
        run: |
          set -euo pipefail
          APK="melisma/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -E "^native-code:.*'armeabi-v7a'" /tmp/apk-badging.txt || {
            echo "No armeabi-v7a native libraries in the test APK"; exit 1;
          }
          grep -E "^native-code:.*'arm64-v8a'" /tmp/apk-badging.txt || {
            echo "No arm64-v8a native libraries in the universal test APK"; exit 1;
          }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"

      - name: Prepare test APK
        run: cp melisma/app/build/outputs/apk/debug/app-debug.apk melisma-universal-v2.7-TEST.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: melisma-universal-v2.7-test-${{ steps.version.outputs.tag }}
          path: melisma-universal-v2.7-TEST.apk
          retention-days: 30
