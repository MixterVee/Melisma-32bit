name: Build Melisma Android TV Receiver

on:
  push:
    branches: [main]
    paths:
      - 'tools/android-tv-receiver/**'
      - '.github/workflows/android-tv-receiver.yml'
  pull_request:
    paths:
      - 'tools/android-tv-receiver/**'
      - '.github/workflows/android-tv-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android TV debug APK
        run: gradle -p tools/android-tv-receiver :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and package
        run: |
          test -s tools/android-tv-receiver/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p tv-receiver-kit
          cp tools/android-tv-receiver/app/build/outputs/apk/debug/app-debug.apk tv-receiver-kit/Melisma-TV-Receiver-v0.1.0.apk
          cp tools/android-tv-receiver/README.md tv-receiver-kit/README.txt

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Melisma-TV-Receiver-v0.1.0-Android-APK
          path: tv-receiver-kit/*
          retention-days: 30
