plugins {
    id 'com.android.application' version '8.8.2'
}

android {
    namespace 'com.mixtervee.melismatv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mixtervee.melismatv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
